# Severity is decided by COST, and the alert sender acts on it:
#   critical  the owner's data is being lost or is about to be, or the machine or the
#             alert path itself is down. Sent at once, and again when it clears.
#   warning   degraded, self-healing or diagnostic. Listed in the daily digest only.
# A summary should name the CAUSE where a metric can supply it (the biggest processes,
# the paging rate, why a voice note was given up), because the summary is the part
# that reaches the phone.
groups:
  - name: native-observability
    interval: 15s
    rules:
      - record: lct:host_cpu_busy_ratio:avg1m
        expr: 1 - avg(avg_over_time(system_cpu_utilization_ratio{state="idle",otel_scope_name=~".*cpuscraper"}[1m]))

      - record: lct:process_cpu_observed_ratio:avg1m
        expr: sum(avg_over_time(process_cpu_utilization_ratio{otel_scope_name=~".*processscraper"}[1m]))

      - record: lct:process_cpu_unattributed_ratio:avg1m
        expr: clamp_min(lct:host_cpu_busy_ratio:avg1m - lct:process_cpu_observed_ratio:avg1m, 0)

      - alert: ObservabilityTargetDown
        expr: up{job=~"otel-collector|otel-metrics|indrasnet|tempo|grafana"} == 0
        for: 2m
        labels:
          severity: critical
          domain: observability
        annotations:
          summary: "{{ $labels.job }} has stopped responding"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for two minutes. Check the matching LCT-Observability scheduled task before changing any probe timeout."

      - alert: IndrasNetErrorWriterMissing
        expr: absent(error_persistence_writer_running{job="indrasnet"}) == 1 and on(job) (up{job="indrasnet"} == 1)
        for: 2m
        labels:
          severity: critical
          domain: error-persistence
        annotations:
          summary: "IndrasNet error-writer telemetry is missing"
          description: "IndrasNet is scrapeable, but its bounded error writer metric is absent. Confirm the deployed web process includes Stage 1 instrumentation."

      - alert: IndrasNetErrorWriterStopped
        expr: error_persistence_writer_running{job="indrasnet"} == 0
        for: 1m
        labels:
          severity: critical
          domain: error-persistence
        annotations:
          summary: "IndrasNet error writer is stopped"
          description: "HTTP requests can still be served, but structured error persistence is unavailable. Inspect the web lifecycle and writer logs."

      - alert: IndrasNetErrorPersistenceLoss
        expr: sum(increase(error_persistence_events_total{job="indrasnet",outcome=~"dropped|write_failed|unavailable|abandoned"}[5m])) > 0
        labels:
          severity: warning
          domain: error-persistence
        annotations:
          summary: "IndrasNet lost at least one structured error record"
          description: "A bounded-writer terminal loss outcome occurred in the last five minutes. Use the outcome and kind labels to distinguish pressure, DB failure, lifecycle loss, or shutdown abandonment. Warning, not critical: what is lost is the structured copy of an error that is still in the text logs. In the 7 days to 2026-11-21 all 95 losses were write_failed on a locked database, so look at what else is firing (memory spikes, the web server freezing) before this."

      - alert: IndrasNetErrorQueuePressure
        expr: max_over_time(error_persistence_queue_depth{job="indrasnet"}[5m]) > 128
        for: 2m
        labels:
          severity: warning
          domain: error-persistence
        annotations:
          summary: "IndrasNet error writer queue is under sustained pressure"
          description: "Queue depth stayed above 128. Correlate with writer latency, SQLite timing, CPU, and tracked thread count before changing queue or timeout limits."

      - alert: CollectorDeliveryFailure
        expr: |
          (
            (sum(increase(otelcol_exporter_send_failed_spans[5m])) or vector(0))
            + (sum(increase(otelcol_exporter_send_failed_metric_points[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_failed_spans[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_refused_spans[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_failed_metric_points[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_refused_metric_points[5m])) or vector(0))
          ) > 0
        labels:
          severity: critical
          domain: telemetry-delivery
        annotations:
          summary: "OpenTelemetry Collector lost or rejected telemetry"
          description: "The collector reported failed delivery or receiver rejection during the last five minutes. Inspect collector logs and exporter labels."

      - alert: CollectorQueueBacklog
        expr: max(otelcol_exporter_queue_size / clamp_min(otelcol_exporter_queue_capacity, 1)) > 0.5
        for: 5m
        labels:
          severity: warning
          domain: telemetry-delivery
        annotations:
          summary: "OpenTelemetry Collector export queue is backing up"
          description: "An exporter queue has remained over 50 percent full for five minutes. Correlate with Prometheus or Tempo availability and host saturation."

      - alert: TempoStorageFailure
        expr: increase(tempodb_retention_errors_total[10m]) > 0 or increase(tempo_ingester_failed_flushes_total[10m]) > 0
        labels:
          severity: critical
          domain: trace-storage
        annotations:
          summary: "Tempo reported a retention or flush failure"
          description: "Trace storage failed during retention or ingestion. Inspect Tempo logs and disk state; do not treat an isolated poller race as application latency."

      - alert: SharedHostCpuSaturation
        expr: lct:host_cpu_busy_ratio:avg1m > 0.95
        for: 2m
        labels:
          severity: warning
          domain: host-contention
        annotations:
          summary: "Shared host CPU saturation is sustained"
          description: "Host CPU utilization exceeded 95 percent for two minutes, matching the measured window that caused local telemetry loss. Use process executable and PID series to attribute contention before changing health-probe timeouts."

      - alert: ProcessAttributionGap
        expr: lct:host_cpu_busy_ratio:avg1m > 0.80 and lct:process_cpu_unattributed_ratio:avg1m > 0.25
        for: 2m
        labels:
          severity: warning
          domain: host-contention
        annotations:
          summary: "Host CPU pressure is not explained by process telemetry"
          description: "More than 25 percentage points of CPU remain unattributed while host CPU exceeds 80 percent. Check Collector process-scraper errors or permissions; do not guess which workload is responsible."

      - alert: ProcessCardinalityPressure
        expr: count(count by (process_pid) (process_cpu_utilization_ratio{otel_scope_name=~".*processscraper"})) > 750
        for: 10m
        labels:
          severity: warning
          domain: telemetry-cardinality
        annotations:
          summary: "Process telemetry cardinality exceeded its evidence threshold"
          description: "More than 750 process IDs have been observed continuously for ten minutes. Measure Collector CPU and Prometheus series growth before changing collection cadence or retention."

      - alert: TrackedProcessThreadGrowth
        expr: sum(process_threads{otel_scope_name=~".*processscraper"}) > 12000
        for: 10m
        labels:
          severity: warning
          domain: host-contention
        annotations:
          summary: "Host process thread count is above the evidence threshold"
          description: "Observed processes exceeded 12,000 threads for ten minutes, compared with a measured baseline near 8,400. Compare by process_executable_name and process_pid; this threshold is diagnostic, not a capacity target."

  - name: asus-reachability
    interval: 30s
    rules:
      - alert: AsusReachSamplerDown
        expr: up{job="indras-reach"} == 0
        for: 3m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus reachability sampler stopped answering"
          description: "Prometheus could not scrape 127.0.0.1:9110 for three minutes. Check the IndrasReachSampler scheduled task and logs/reach_sampler.log in the IndrasNet checkout; until it is back there is no record of whether the machine can be reached."

      - alert: AsusReachSamplerStale
        expr: time() - indras_reach_sample_timestamp_seconds > 180
        for: 2m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus reachability sampler is up but has stopped producing samples"
          description: "The endpoint answers but its latest sample is older than three minutes (a timestamp of 0 means it never produced one). A probe is probably hung; read logs/reach_sampler.log."

      - alert: AsusNetworkDown
        expr: |
          indras_reach_state{state=~"internet_down|lan_down|no_link"} == 1
          unless on() (sum_over_time(indras_reach_throughput_mbps{nic="Wi-Fi",direction="up"}[5m]) / on() count_over_time(indras_reach_state{state="ok"}[5m])) > 2
        for: 5m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus has had no working network for five minutes ({{ $labels.state }})"
          description: "Measured from the Asus itself, so this can only fire while the box and Prometheus are running. Not raised while this machine uploads more than 2 Mbit/s on average: then its own upload is the cause and AsusUploadChokingNetwork fires instead. Read indras_reach_reason and indras_reach_ac_online: AC off with the router silent is a power cut; router fine but internet failing is the ISP."

      - alert: AsusNetworkUnreliable
        expr: |
          max without (state) (avg_over_time(indras_reach_state{state="ok"}[15m])) < 0.5
          unless on() (sum_over_time(indras_reach_throughput_mbps{nic="Wi-Fi",direction="up"}[15m]) / on() count_over_time(indras_reach_state{state="ok"}[15m])) > 2
        for: 5m
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "The Asus network has been OK less than half of the last 15 minutes"
          description: "Counts every not-OK verdict, so a network flapping between degraded and down still fires (no per-state for: can catch that). Not raised while this machine uploads more than 2 Mbit/s on average; AsusUploadChokingNetwork covers that. See the mix with avg_over_time(indras_reach_state[15m]) and the cause in indras_reach_reason."

      - alert: AsusUploadChokingNetwork
        expr: |
          max without (state) (avg_over_time(indras_reach_state{state="ok"}[15m])) < 0.5
          and on() (sum_over_time(indras_reach_throughput_mbps{nic="Wi-Fi",direction="up"}[15m]) / on() count_over_time(indras_reach_state{state="ok"}[15m])) > 2
        for: 5m
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "The Asus is choking its own Wi-Fi with uploads"
          description: "The network was OK less than half of the last 15 minutes while this machine uploaded more than 2 Mbit/s on average. Measured 2026-11-11 to 11-13: about 4 Mbit/s nonstop (roughly 49 GB in 42 hours; GoogleDriveFS held the most internet connections) left it fully reachable only 35% of the time, with router pings and internet connects timing out behind the upload. Pause or rate-limit the upload before blaming the router."

      - alert: AsusDriveUploadUncapped
        expr: |
          (
            indras_drive_upload_cap_active_kbps != on() indras_drive_upload_cap_configured_kbps
            or (indras_drive_upload_cap_active_kbps == 0 unless on() indras_drive_upload_cap_configured_kbps)
          ) and on() indras_drive_running == 1
        for: 5m
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "Google Drive on the Asus is not applying its configured upload cap"
          description: "The running Drive worker's own log shows a different upload cap (0 = none) from the configured BandwidthTxKBPS, or no cap is configured at all while Drive uploads uncapped. The second case is what happened on 2026-11-14: the cap had been written only into the Claude desktop app's private registry copy, a Drive restart came up uncapped, and ~10 Mbit/s uploads degraded the network for most of two days. Fix: write BandwidthTxKBPS into the real HKCU from outside Claude (e.g. a scheduled task running reg add), restart Drive from outside too, and confirm drive_fs.txt logs Upload speed throttled. If running Drive uncapped is intended, delete this alert."

      - alert: AsusRemoteAccessServiceDown
        expr: indras_reach_service_running == 0
        for: 5m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "{{ $labels.service }} is not running on the Asus"
          description: "sshd, RustDesk and Tailscale are how the box is reached remotely. Start the Windows service; if it keeps stopping, read its event log."

      - alert: AsusTailscaleNotRunning
        expr: indras_reach_tailscale_running == 0 unless on() indras_reach_tailscale_status_ok == 0
        for: 3m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "Tailscale reports itself not Running on the Asus"
          description: "tailscale status answered and the backend is stopped or logged out, so the tailnet cannot reach this machine. Run tailscale status. When the status command does not answer at all, AsusTailscaleStatusUnavailable fires instead."

      - alert: AsusTailscaleStatusUnavailable
        expr: indras_reach_tailscale_status_ok == 0 and on() indras_reach_tailnet_down == 1
        for: 5m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "Tailscale on the Asus is not answering, and the tailnet peer did not reply either"
          description: "The tailscale CLI got no answer from the local tailscaled, and no ping to the tailnet peer got through in the same samples, so remote access over the tailnet is probably broken. Keyed on indras_reach_tailnet_down, which the sampler sets whatever the network verdict, so a degraded network cannot hide it. Not raised while a tailnet ping still answers. Check the Tailscale service and tailscale status."

      - alert: AsusReachProbesFailing
        expr: indras_reach_probe_ok{probe!="tailscale"} == 0
        for: 10m
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "The reach sampler's {{ $labels.probe }} probe has not been able to run for 10 minutes"
          description: "A command it relies on is timing out or failing, so that part of the network picture is unknown (it is not counted as an outage). Commands timing out often means the machine itself is stalling, which can make SSH and RustDesk unusable too. See probe_ms and probe_failed in reach.jsonl."

      - alert: AsusUncleanRestart
        expr: increase(indras_crash_ledger_records_total{kind=~"bugcheck|forced_power_off|sleep_transition_failure|power_loss_or_hard_hang"}[1h]) > 0
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus restarted without shutting down cleanly in the last hour ({{ $labels.kind }})"
          description: "Recorded by crash_watch.py in logs/crash_ledger.jsonl with the bugcheck code, dump path and the sampler's last reading before the crash. Repeated different bugcheck codes point at hardware (RAM, CPU, heat) more than one driver."

      - alert: AsusCrashWatchStale
        expr: time() - indras_crash_watch_last_run_timestamp_seconds > 7200
        for: 10m
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "crash_watch.py has not completed a pass in over two hours"
          description: "It should run hourly. The System log keeps only about four days, so every hour it does not run risks an unrecorded crash. Check the IndrasCrashWatch scheduled task."

  - name: asus-machine-health
    rules:
      - alert: AsusMemoryCommitHigh
        expr: indras_sys_commit_used_ratio > 0.95
        for: 10m
        labels:
          severity: warning
          domain: machine
        annotations:
          summary: "The Asus has used over 95% of its memory commit limit for 10 minutes.{{ with query \"topk(3, indras_sys_process_commit_bytes)\" }} Biggest:{{ range . }} {{ .Labels.name }} {{ .Value | humanize1024 }}B;{{ end }}{{ end }}"
          description: "Commit is RAM plus page file. When it runs out, programs fail to allocate and crash even if RAM looks free. In the 13.5 days before this rule it happened 6 times, the longest for 103 minutes on 2026-11-01. sys_health.jsonl names the biggest processes (lately Beeper, Discord, Windows Terminal and the IndrasNet web server). The current level is indras_sys_commit_used_ratio."
      - alert: AsusMemoryCommitExhausted
        expr: indras_sys_commit_used_ratio > 0.98
        for: 2m
        labels:
          severity: critical
          domain: machine
        annotations:
          summary: "The Asus is about to run out of memory (commit over 98%).{{ with query \"topk(3, indras_sys_process_commit_bytes)\" }} Biggest:{{ range . }} {{ .Labels.name }} {{ .Value | humanize1024 }}B;{{ end }}{{ end }}"
          description: "Allocations are failing or about to. Expect apps to crash and the machine to freeze: on 2026-11-07 it froze for 3 minutes at 96.8%. Close something large now. AsusMemoryCommitHigh fires alongside it once this lasts 10 minutes."
      - alert: AsusDiskLow
        expr: indras_sys_disk_free_bytes < 10737418240
        for: 10m
        labels:
          severity: warning
          domain: machine
        annotations:
          summary: "Drive {{ $labels.drive }} on the Asus has under 10 GB free"
          description: "On C: a full disk also stops the page file growing, which turns memory pressure into crashes. C: was under 10 GB 4 times in the 13.5 days before this rule, once for 5.5 hours on 2026-11-03. Free space is indras_sys_disk_free_bytes."
      - alert: AsusDiskCritical
        expr: indras_sys_disk_free_bytes < 5368709120
        for: 5m
        labels:
          severity: critical
          domain: machine
        annotations:
          summary: "Drive {{ $labels.drive }} on the Asus has under 5 GB free"
          description: "Writes and updates are about to fail, and on C: so is page-file growth. C: went below 5 GB twice in the 13.5 days before this rule (2.3 GB on 2026-11-11). Free space now, before the next memory spike. AsusDiskLow fires alongside it once this lasts 10 minutes."
      - alert: AsusMemorySpikes
        expr: count_over_time((indras_sys_commit_used_ratio > 0.93)[1h:1m]) >= 3
        labels:
          severity: warning
          domain: machine
        annotations:
          summary: "The Asus hit over 93% of its memory commit limit {{ $value }} times in the last hour.{{ with query \"topk(3, indras_sys_process_commit_bytes)\" }} Biggest:{{ range . }} {{ .Labels.name }} {{ .Value | humanize1024 }}B;{{ end }}{{ end }}{{ with query \"indras_sys_agent_processes > 0\" }} Running:{{ range . }} {{ .Value }} {{ .Labels.kind }};{{ end }}{{ end }}"
          description: "Short memory-exhaustion spikes, which AsusMemoryCommitHigh (over 95% for 10 minutes) cannot see. On 2026-11-21, the day voice notes were given up on a locked database and the web server kept freezing, the half-hourly commit peak was 93-96% in 14 of 39 half-hours while the median stayed at 81-85% and free RAM dipped to 0.1-0.6 GB; after a 14 GB terminal window was closed the peak fell to 65%. The processes named are the biggest NOW, which may not be what spiked: logs/reach.jsonl keeps the per-sample process list (the processes field) for the minute it happened. Whether these spikes caused that day's failures is likely but not proven."
      - alert: AsusMemoryStarved
        expr: indras_sys_ram_available_bytes < 1073741824 and on() indras_sys_paging_pages_per_second{direction="in"} > 2000
        for: 3m
        labels:
          severity: warning
          domain: machine
        annotations:
          summary: "Under 1 GB of RAM is free and the Asus is reading {{ with query \"indras_sys_paging_pages_per_second{direction='in'}\" }}{{ range . }}{{ .Value | printf \"%.0f\" }}{{ end }}{{ end }} pages a second from disk.{{ with query \"topk(3, indras_sys_process_commit_bytes)\" }} Biggest:{{ range . }} {{ .Labels.name }} {{ .Value | humanize1024 }}B;{{ end }}{{ end }}{{ with query \"indras_sys_agent_processes > 0\" }} Running:{{ range . }} {{ .Value }} {{ .Labels.kind }};{{ end }}{{ end }}"
          description: "The hard-fault rate alone is NOT a sign of trouble here: a healthy day reads 5,000-6,000 pages a second because Beeper and Python read their database files through mapped memory (measured 2026-11-21 with 7 GB free). Only together with exhausted RAM does it mean programs are waiting on memory being read back from disk. This rule has never been seen to fire: it is a warning until indras_sys_paging_pages_per_second has a week of history to set it from."
      - alert: AsusAgentLoadHigh
        expr: sum(indras_sys_agent_commit_bytes) / on() indras_sys_commit_limit_bytes > 0.15
        for: 30m
        labels:
          severity: warning
          domain: machine
        annotations:
          summary: "Agents and test runs hold {{ $value | humanizePercentage }} of the memory this machine can commit.{{ with query \"indras_sys_agent_processes > 0\" }} Running:{{ range . }} {{ .Value }} {{ .Labels.kind }};{{ end }}{{ end }}"
          description: "Counts claude, codex, pytest and vitest processes (indras_sys_agent_processes) and the memory they hold (indras_sys_agent_commit_bytes). Production shares this machine with them, and waves of agents and test runs coincided with its memory spikes on 2026-11-20/21. Python processes that an agent started for anything other than pytest are not counted, so the true share is higher."
      - alert: AsusMachineMetricsMissing
        expr: (absent(indras_sys_commit_used_ratio) or on() absent(indras_sys_disk_free_bytes{drive="C:"}) or on() absent(indras_sys_paging_pages_per_second) or on() absent(indras_sys_agent_processes)) and on() up{job="indras-reach"} == 1
        for: 10m
        labels:
          severity: warning
          domain: machine
        annotations:
          summary: "The reach sampler is running but not reporting memory, paging, process load or C: disk space"
          description: "One of its machine probes is failing (see logs/reach_sampler.log and indras_reach_probe_ok), or a sampler older than these metrics is running. Until this clears the memory and disk alerts cannot fire, and memory alerts cannot name the biggest processes."

  - name: indrasnet-voice
    rules:
      - alert: IndrasVoiceNoteGivenUp
        expr: indras_voice_given_up_24h > 0
        for: 1m
        labels:
          severity: critical
          domain: voice
        annotations:
          summary: "A live voice note was given up without its text.{{ with query \"indras_voice_given_up_by_reason{window='24h'} > 0\" }} Why:{{ range . }} {{ .Labels.reason }} x{{ .Value }};{{ end }}{{ end }}"
          description: "IndrasNet stopped trying to turn a voice note into text in the last 24 hours (reprocessing_queue status exhausted or failed). The audio is kept on disk. Between 2026-10-17 and 11-14, 21 notes were lost this way and nobody noticed for a month. Find them with the live_voice jobs in reprocessing_queue and redo voice-to-text on the M5."
      - alert: IndrasVoiceNoteWaitingTooLong
        expr: indras_voice_waiting_oldest_age_seconds > 7200
        for: 10m
        labels:
          severity: warning
          domain: voice
        annotations:
          summary: "A voice note has waited over 2 hours for its text"
          description: "The oldest live voice note still queued or in progress is over two hours old. Usually the M5 voice-to-text service is down or saturated (check its /health), so the note is waiting rather than lost."
      - alert: IndrasVoiceDeliveryFailing
        expr: indras_voice_delivery_failed_24h > 0
        for: 1m
        labels:
          severity: critical
          domain: voice
        annotations:
          summary: "A voice note's text could not be delivered"
          description: "A voice-text delivery attempt failed in the last 24 hours (voice_delivery_events 'failed'). Until 2026-11-14 deliveries went to a deleted Telegram chat and every one failed silently. Check that the voice delivery chat setting in IndrasNet points at a chat that exists."
      - alert: IndrasVoiceMetricsMissing
        expr: indras_telemetry_source_ok{source="voice"} == 0
        for: 15m
        labels:
          severity: warning
          domain: voice
        annotations:
          summary: "The telemetry exporter cannot read voice-note health"
          description: "Until this clears, a given-up or undelivered voice note cannot raise an alert. Check the IndrasTelemetryExporter task and that it can read the IndrasNet database."
  - name: indrasnet-voice-canary
    rules:
      - alert: IndrasVoiceCanaryFailed
        expr: indras_canary_voice_last_ok == 0
        for: 5m
        labels:
          severity: critical
          domain: voice
        annotations:
          summary: "The daily voice canary did not arrive"
          description: "IndrasNet sends itself one synthetic voice note a day and checks that its text is delivered to the owner's chat. The last run did not deliver, so real voice notes are probably not arriving either. Read IndrasNet logs/voice_canary.status.json: 'outcome' says whether it was given up, timed out, delivered the wrong text, or could not be injected, and 'detail' carries the pipeline's own error."
      - alert: IndrasVoiceCanaryNotRunning
        expr: time() - indras_canary_voice_last_run_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: warning
          domain: voice
        annotations:
          summary: "The voice canary has not run for over a day"
          description: "No canary run has started in the last 26 hours, so a broken voice path would go unnoticed. Check the IndrasVoiceCanary scheduled task and IndrasNet logs/voice_canary.log."
      - alert: IndrasVoiceCanaryMetricsMissing
        expr: indras_telemetry_source_ok{source="voice_canary"} == 0
        for: 26h
        labels:
          severity: warning
          domain: voice
        annotations:
          summary: "The telemetry exporter cannot read the voice canary's result"
          description: "The canary has never written a result, or its status file is unreadable. Install the task with IndrasNet scripts/install_voice_canary_task.ps1, or check logs/voice_canary.status.json."
  - name: indrasnet-web-health
    rules:
      - alert: IndrasWebLoopFreezing
        expr: indras_web_loop_freezes_1h > 10
        for: 15m
        labels:
          severity: warning
          domain: indrasnet
        annotations:
          summary: "The IndrasNet web server is freezing repeatedly ({{ $value }} times in the last hour).{{ with query \"indras_sys_ram_available_bytes\" }}{{ range . }} RAM free: {{ .Value | humanize1024 }}B.{{ end }}{{ end }}{{ with query \"max_over_time(indras_sys_commit_used_ratio[1h])\" }}{{ range . }} Commit peak in the last hour: {{ .Value | humanizePercentage }}.{{ end }}{{ end }}"
          description: "The web server's event loop froze (watchdog dump, 8 s or longer) more than 10 times in the last hour. While frozen it answers nothing: the UI, agents and health checks all stall, and three failed health checks make the supervisor force-restart it. On 2026-11-18 it froze 292 times in 24 hours unnoticed. Read the newest dumps in IndrasNet logs/loop_freeze_tracebacks.log; the top IndrasNet frame on the loop thread is the blocking call."
      - alert: IndrasAgentWritesRejected
        expr: max by (log) (indras_agent_auth_rejections_1h) > 0
        for: 15m
        labels:
          severity: warning
          domain: indrasnet
        annotations:
          summary: "An IndrasNet agent's writes are being refused by the web server"
          description: "Lines in IndrasNet logs/{{ $labels.log }}.log show 403 SERVICE_TOKEN_INVALID: the agent sends writes to the web server without a valid service token, so the web server drops them. This silently broke prayer triggers until 2026-11-11 and Beeper source registration all of 2026-11-18. The fix is for the agent to use core.auth.web_client.local_web_auth_headers."
      - alert: IndrasLogLineRepeating
        expr: indras_log_repeats_1h > 200
        for: 6h
        labels:
          severity: warning
          domain: indrasnet
        annotations:
          summary: "A {{ $labels.level }} line in {{ $labels.log }}.log from {{ $labels.logger }} has repeated over 200 times an hour for 6 hours (id {{ $labels.id }})"
          description: "Found by counting, not by anyone predicting it: every other alert here was written after its incident, while one warning repeated every minute for a month unread. The line itself is in IndrasNet logs/log_repeats.json under this id (it stays on the machine because log lines can carry names). Either fix what it reports or lower its level if it is expected."
      - alert: IndrasLogSignalsMissing
        expr: indras_telemetry_source_ok{source=~"log_signals|log_repeats"} == 0
        for: 15m
        labels:
          severity: warning
          domain: indrasnet
        annotations:
          summary: "The telemetry exporter cannot read IndrasNet logs ({{ $labels.source }})"
          description: "Until this clears, web-server freezes, refused agent writes and repeating log lines cannot raise an alert. Check the IndrasTelemetryExporter task and that it can read the IndrasNet logs directory."
  - name: outside-watch-and-m5
    rules:
      - alert: OutsideWatcherUnreachable
        expr: indras_m5_watch_up == 0 or on() (absent(indras_m5_watch_up) and on() up{job="indrasnet-telemetry"} == 1)
        for: 30m
        labels:
          severity: warning
          domain: outside-watch
        annotations:
          summary: "The outside watcher on the M5 has not answered for 30 minutes"
          description: "Everything that watches the Asus runs on the Asus, so a freeze or an outage here silences its own alerts. The watcher on the M5 (IndrasNet scripts/ops/m5/asus_watch.py, port 5093; 5097 on the M5 is a different service) is the only thing that would notice. While it is unreachable nobody is told if this machine goes down. Usually the M5 is asleep or off; if it is awake, check the com.aditya.asus-watch LaunchAgent and the macOS firewall. This also fires when the watcher was never installed or the telemetry exporter is older than this metric."
      - alert: OutsideWatcherNotReceivingBeats
        expr: indras_m5_watch_beat_age_seconds > 900
        for: 10m
        labels:
          severity: warning
          domain: outside-watch
        annotations:
          summary: "The M5 watcher answers, but has not received this machine's beat for {{ $value | humanizeDuration }}"
          description: "The alert sender posts a beat to the M5 after every run (every 2 minutes). The M5 is reachable from here yet is not getting them, so the IndrasAlertNotifier task is not running, is failing before it sends, or its ALERT_BEAT_URLS points somewhere else. Read IndrasNet logs/alert_notifier.log."
      - alert: M5BusyWhileVoiceWaits
        expr: indras_voice_waiting > 0 and on() indras_m5_ci_jobs_running > 0
        for: 30m
        labels:
          severity: warning
          domain: voice
        annotations:
          summary: "Voice notes are waiting while the M5 runs CI jobs{{ with query \"indras_m5_load1\" }}{{ range . }} (M5 load {{ .Value | printf \"%.1f\" }}){{ end }}{{ end }}"
          description: "The M5 does voice-to-text and also hosts both CI runners. On 2026-11-21 it turned a 10-minute note into text in 14 minutes, about 1x realtime instead of the usual 28x or more, and nothing recorded why. This says when the two coincide: {{ $value }} note(s) waiting, with indras_m5_ci_jobs_running and indras_m5_load1 as the evidence."
