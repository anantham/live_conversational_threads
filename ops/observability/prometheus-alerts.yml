groups:
  - name: native-observability
    interval: 15s
    rules:
      - record: lct:host_cpu_busy_ratio:avg1m
        expr: 1 - avg(avg_over_time(system_cpu_utilization_ratio{state="idle",otel_scope_name=~".*cpuscraper"}[1m]))

      - record: lct:process_cpu_observed_ratio:avg1m
        expr: sum(avg_over_time(process_cpu_utilization_ratio{otel_scope_name=~".*processscraper"}[1m]))

      - record: lct:process_cpu_unattributed_ratio:avg1m
        expr: clamp_min(lct:host_cpu_busy_ratio:avg1m - lct:process_cpu_observed_ratio:avg1m, 0)

      - alert: ObservabilityTargetDown
        expr: up{job=~"otel-collector|otel-metrics|indrasnet|tempo|grafana"} == 0
        for: 2m
        labels:
          severity: critical
          domain: observability
        annotations:
          summary: "{{ $labels.job }} has stopped responding"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for two minutes. Check the matching LCT-Observability scheduled task before changing any probe timeout."

      - alert: IndrasNetErrorWriterMissing
        expr: absent(error_persistence_writer_running{job="indrasnet"}) == 1 and on(job) (up{job="indrasnet"} == 1)
        for: 2m
        labels:
          severity: critical
          domain: error-persistence
        annotations:
          summary: "IndrasNet error-writer telemetry is missing"
          description: "IndrasNet is scrapeable, but its bounded error writer metric is absent. Confirm the deployed web process includes Stage 1 instrumentation."

      - alert: IndrasNetErrorWriterStopped
        expr: error_persistence_writer_running{job="indrasnet"} == 0
        for: 1m
        labels:
          severity: critical
          domain: error-persistence
        annotations:
          summary: "IndrasNet error writer is stopped"
          description: "HTTP requests can still be served, but structured error persistence is unavailable. Inspect the web lifecycle and writer logs."

      - alert: IndrasNetErrorPersistenceLoss
        expr: sum(increase(error_persistence_events_total{job="indrasnet",outcome=~"dropped|write_failed|unavailable|abandoned"}[5m])) > 0
        labels:
          severity: critical
          domain: error-persistence
        annotations:
          summary: "IndrasNet lost at least one structured error record"
          description: "A bounded-writer terminal loss outcome occurred in the last five minutes. Use the outcome and kind labels to distinguish pressure, DB failure, lifecycle loss, or shutdown abandonment."

      - alert: IndrasNetErrorQueuePressure
        expr: max_over_time(error_persistence_queue_depth{job="indrasnet"}[5m]) > 128
        for: 2m
        labels:
          severity: warning
          domain: error-persistence
        annotations:
          summary: "IndrasNet error writer queue is under sustained pressure"
          description: "Queue depth stayed above 128. Correlate with writer latency, SQLite timing, CPU, and tracked thread count before changing queue or timeout limits."

      - alert: CollectorDeliveryFailure
        expr: |
          (
            (sum(increase(otelcol_exporter_send_failed_spans[5m])) or vector(0))
            + (sum(increase(otelcol_exporter_send_failed_metric_points[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_failed_spans[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_refused_spans[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_failed_metric_points[5m])) or vector(0))
            + (sum(increase(otelcol_receiver_refused_metric_points[5m])) or vector(0))
          ) > 0
        labels:
          severity: critical
          domain: telemetry-delivery
        annotations:
          summary: "OpenTelemetry Collector lost or rejected telemetry"
          description: "The collector reported failed delivery or receiver rejection during the last five minutes. Inspect collector logs and exporter labels."

      - alert: CollectorQueueBacklog
        expr: max(otelcol_exporter_queue_size / clamp_min(otelcol_exporter_queue_capacity, 1)) > 0.5
        for: 5m
        labels:
          severity: warning
          domain: telemetry-delivery
        annotations:
          summary: "OpenTelemetry Collector export queue is backing up"
          description: "An exporter queue has remained over 50 percent full for five minutes. Correlate with Prometheus or Tempo availability and host saturation."

      - alert: TempoStorageFailure
        expr: increase(tempodb_retention_errors_total[10m]) > 0 or increase(tempo_ingester_failed_flushes_total[10m]) > 0
        labels:
          severity: critical
          domain: trace-storage
        annotations:
          summary: "Tempo reported a retention or flush failure"
          description: "Trace storage failed during retention or ingestion. Inspect Tempo logs and disk state; do not treat an isolated poller race as application latency."

      - alert: SharedHostCpuSaturation
        expr: lct:host_cpu_busy_ratio:avg1m > 0.95
        for: 2m
        labels:
          severity: warning
          domain: host-contention
        annotations:
          summary: "Shared host CPU saturation is sustained"
          description: "Host CPU utilization exceeded 95 percent for two minutes, matching the measured window that caused local telemetry loss. Use process executable and PID series to attribute contention before changing health-probe timeouts."

      - alert: ProcessAttributionGap
        expr: lct:host_cpu_busy_ratio:avg1m > 0.80 and lct:process_cpu_unattributed_ratio:avg1m > 0.25
        for: 2m
        labels:
          severity: warning
          domain: host-contention
        annotations:
          summary: "Host CPU pressure is not explained by process telemetry"
          description: "More than 25 percentage points of CPU remain unattributed while host CPU exceeds 80 percent. Check Collector process-scraper errors or permissions; do not guess which workload is responsible."

      - alert: ProcessCardinalityPressure
        expr: count(count by (process_pid) (process_cpu_utilization_ratio{otel_scope_name=~".*processscraper"})) > 750
        for: 10m
        labels:
          severity: warning
          domain: telemetry-cardinality
        annotations:
          summary: "Process telemetry cardinality exceeded its evidence threshold"
          description: "More than 750 process IDs have been observed continuously for ten minutes. Measure Collector CPU and Prometheus series growth before changing collection cadence or retention."

      - alert: TrackedProcessThreadGrowth
        expr: sum(process_threads{otel_scope_name=~".*processscraper"}) > 12000
        for: 10m
        labels:
          severity: warning
          domain: host-contention
        annotations:
          summary: "Host process thread count is above the evidence threshold"
          description: "Observed processes exceeded 12,000 threads for ten minutes, compared with a measured baseline near 8,400. Compare by process_executable_name and process_pid; this threshold is diagnostic, not a capacity target."

  - name: asus-reachability
    interval: 30s
    rules:
      - alert: AsusReachSamplerDown
        expr: up{job="indras-reach"} == 0
        for: 3m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus reachability sampler stopped answering"
          description: "Prometheus could not scrape 127.0.0.1:9110 for three minutes. Check the IndrasReachSampler scheduled task and logs/reach_sampler.log in the IndrasNet checkout; until it is back there is no record of whether the machine can be reached."

      - alert: AsusReachSamplerStale
        expr: time() - indras_reach_sample_timestamp_seconds > 180
        for: 2m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus reachability sampler is up but has stopped producing samples"
          description: "The endpoint answers but its latest sample is older than three minutes (a timestamp of 0 means it never produced one). A probe is probably hung; read logs/reach_sampler.log."

      - alert: AsusNetworkDown
        expr: indras_reach_state{state=~"internet_down|lan_down|no_link"} == 1
        for: 5m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus has had no working network for five minutes ({{ $labels.state }})"
          description: "Measured from the Asus itself, so this can only fire while the box and Prometheus are running; a power cut that takes the router and the laptop's charger together will not alert. Read indras_reach_reason and indras_reach_ac_online: AC loss with the router down is the power-cut case, a saturated uplink is the self-inflicted one."

      - alert: AsusNetworkDegraded
        expr: indras_reach_state{state="degraded"} == 1
        for: 15m
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "The Asus network has been degraded for 15 minutes"
          description: "Router loss or latency, a slow internet connect, or a saturated uplink. SSH and RustDesk stall in this state even though the machine is up. See indras_reach_reason for which."

      - alert: AsusUplinkSaturated
        expr: count_over_time(indras_reach_reason{reason="uplink_saturated"}[30m]) >= 60
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "The Asus has saturated its own Wi-Fi uplink for most of the last 30 minutes"
          description: "Upload filled at least a third of the Wi-Fi link rate for roughly 15 of the last 30 minutes. On 2026-11-05 a 13-hour upload did this and left the machine fully reachable only 25 percent of the time. Check which process is uploading (GoogleDriveFS was the suspect) before blaming the router."

      - alert: AsusRemoteAccessServiceDown
        expr: indras_reach_service_running == 0
        for: 5m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "{{ $labels.service }} is not running on the Asus"
          description: "sshd, RustDesk and Tailscale are how the box is reached remotely. Start the Windows service; if it keeps stopping, read its event log."

      - alert: AsusTailscaleNotRunning
        expr: indras_reach_tailscale_running == 0
        for: 3m
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "Tailscale is not in the Running state on the Asus"
          description: "The service may be up while the backend is stopped or logged out, in which case the tailnet cannot reach this machine. Run tailscale status."

      - alert: AsusUncleanRestart
        expr: increase(indras_crash_ledger_records_total{kind=~"bugcheck|forced_power_off|sleep_transition_failure|power_loss_or_hard_hang"}[1h]) > 0
        labels:
          severity: critical
          domain: reachability
        annotations:
          summary: "The Asus restarted without shutting down cleanly in the last hour ({{ $labels.kind }})"
          description: "Recorded by crash_watch.py in logs/crash_ledger.jsonl with the bugcheck code, dump path and the sampler's last reading before the crash. Repeated different bugcheck codes point at hardware (RAM, CPU, heat) more than one driver."

      - alert: AsusCrashWatchStale
        expr: time() - indras_crash_watch_last_run_timestamp_seconds > 7200
        for: 10m
        labels:
          severity: warning
          domain: reachability
        annotations:
          summary: "crash_watch.py has not completed a pass in over two hours"
          description: "It should run hourly. The System log keeps only about four days, so every hour it does not run risks an unrecorded crash. Check the IndrasCrashWatch scheduled task."
