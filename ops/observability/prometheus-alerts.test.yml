# Rule tests for prometheus-alerts.yml. Run from this directory:
#   promtool test rules prometheus-alerts.test.yml
#
# What this proves: the alert summaries that name a CAUSE actually render. They use the
# `query` template function (Prometheus alerting-rule templates provide it, alongside
# `first`, `value`, `humanize1024` and the rest), and `promtool check rules` only parses
# a template; it does not execute it. Each case below evaluates the rule against
# realistic series and compares the full rendered text.
#
# Generated by a script from the rules file: descriptions and labels are copied from
# the rule, so only the rendered summaries are stated here.
rule_files:
  - prometheus-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: "indras_sys_commit_used_ratio"
        values: "0.96x200"
      - series: "indras_sys_commit_limit_bytes"
        values: "60000000000x200"
      - series: "indras_sys_ram_available_bytes"
        values: "500000000x200"
      - series: "indras_sys_paging_pages_per_second{direction=\"in\"}"
        values: "6066x200"
      - series: "indras_sys_process_commit_bytes{name=\"WindowsTerminal.exe\"}"
        values: "15337000000x200"
      - series: "indras_sys_process_commit_bytes{name=\"claude.exe\"}"
        values: "9985000000x200"
      - series: "indras_sys_process_commit_bytes{name=\"python.exe\"}"
        values: "6580000000x200"
      - series: "indras_sys_process_commit_bytes{name=\"Beeper.exe\"}"
        values: "2730000000x200"
      - series: "indras_sys_agent_processes{kind=\"claude\"}"
        values: "23x200"
      - series: "indras_sys_agent_processes{kind=\"codex\"}"
        values: "1x200"
      - series: "indras_sys_agent_processes{kind=\"pytest\"}"
        values: "0x200"
      - series: "indras_sys_agent_commit_bytes{kind=\"claude\"}"
        values: "9985000000x200"
      - series: "indras_sys_agent_commit_bytes{kind=\"codex\"}"
        values: "411000000x200"
      - series: "indras_voice_given_up_24h"
        values: "2x200"
      - series: "indras_voice_given_up_by_reason{window=\"24h\",reason=\"database_locked\"}"
        values: "2x200"
      - series: "indras_voice_given_up_by_reason{window=\"24h\",reason=\"m5_deadline\"}"
        values: "0x200"
      - series: "indras_web_loop_freezes_1h"
        values: "14x200"
      - series: "indras_voice_waiting"
        values: "2x200"
      - series: "indras_m5_ci_jobs_running"
        values: "2x200"
      - series: "indras_m5_load1"
        values: "11.4x200"
    alert_rule_test:
      - eval_time: 150m
        alertname: AsusMemoryCommitHigh
        exp_alerts:
          - exp_labels:
              domain: "machine"
              severity: "warning"
            exp_annotations:
              summary: "The Asus has used over 95% of its memory commit limit for 10 minutes. Biggest: WindowsTerminal.exe 14.28GiB; claude.exe 9.299GiB; python.exe 6.128GiB;"
              description: "Commit is RAM plus page file. When it runs out, programs fail to allocate and crash even if RAM looks free. In the 13.5 days before this rule it happened 6 times, the longest for 103 minutes on 2026-11-01. sys_health.jsonl names the biggest processes (lately Beeper, Discord, Windows Terminal and the IndrasNet web server). The current level is indras_sys_commit_used_ratio."
      - eval_time: 150m
        alertname: AsusMemorySpikes
        exp_alerts:
          - exp_labels:
              domain: "machine"
              severity: "warning"
            exp_annotations:
              summary: "The Asus hit over 93% of its memory commit limit 60 times in the last hour. Biggest: WindowsTerminal.exe 14.28GiB; claude.exe 9.299GiB; python.exe 6.128GiB; Running: 23 claude; 1 codex;"
              description: "Short memory-exhaustion spikes, which AsusMemoryCommitHigh (over 95% for 10 minutes) cannot see. On 2026-11-21, the day voice notes were given up on a locked database and the web server kept freezing, the half-hourly commit peak was 93-96% in 14 of 39 half-hours while the median stayed at 81-85% and free RAM dipped to 0.1-0.6 GB; after a 14 GB terminal window was closed the peak fell to 65%. The processes named are the biggest NOW, which may not be what spiked: logs/reach.jsonl keeps the per-sample process list (the processes field) for the minute it happened. Whether these spikes caused that day's failures is likely but not proven."
      - eval_time: 150m
        alertname: AsusMemoryStarved
        exp_alerts:
          - exp_labels:
              domain: "machine"
              severity: "warning"
            exp_annotations:
              summary: "Under 1 GB of RAM is free and the Asus is reading 6066 pages a second from disk. Biggest: WindowsTerminal.exe 14.28GiB; claude.exe 9.299GiB; python.exe 6.128GiB; Running: 23 claude; 1 codex;"
              description: "The hard-fault rate alone is NOT a sign of trouble here: a healthy day reads 5,000-6,000 pages a second because Beeper and Python read their database files through mapped memory (measured 2026-11-21 with 7 GB free). Only together with exhausted RAM does it mean programs are waiting on memory being read back from disk. This rule has never been seen to fire: it is a warning until indras_sys_paging_pages_per_second has a week of history to set it from."
      - eval_time: 150m
        alertname: AsusAgentLoadHigh
        exp_alerts:
          - exp_labels:
              domain: "machine"
              severity: "warning"
            exp_annotations:
              summary: "Agents and test runs hold 17.33% of the memory this machine can commit. Running: 23 claude; 1 codex;"
              description: "Counts claude, codex, pytest and vitest processes (indras_sys_agent_processes) and the memory they hold (indras_sys_agent_commit_bytes). Production shares this machine with them, and waves of agents and test runs coincided with its memory spikes on 2026-11-20/21. Python processes that an agent started for anything other than pytest are not counted, so the true share is higher."
      - eval_time: 150m
        alertname: IndrasVoiceNoteGivenUp
        exp_alerts:
          - exp_labels:
              domain: "voice"
              severity: "critical"
            exp_annotations:
              summary: "A live voice note was given up without its text. Why: database_locked x2;"
              description: "IndrasNet stopped trying to turn a voice note into text in the last 24 hours (reprocessing_queue status exhausted or failed). The audio is kept on disk. Between 2026-10-17 and 11-14, 21 notes were lost this way and nobody noticed for a month. Find them with the live_voice jobs in reprocessing_queue and redo voice-to-text on the M5."
      - eval_time: 150m
        alertname: IndrasWebLoopFreezing
        exp_alerts:
          - exp_labels:
              domain: "indrasnet"
              severity: "warning"
            exp_annotations:
              summary: "The IndrasNet web server is freezing repeatedly (14 times in the last hour). RAM free: 476.8MiB. Commit peak in the last hour: 96%."
              description: "The web server's event loop froze (watchdog dump, 8 s or longer) more than 10 times in the last hour. While frozen it answers nothing: the UI, agents and health checks all stall, and three failed health checks make the supervisor force-restart it. On 2026-11-18 it froze 292 times in 24 hours unnoticed. Read the newest dumps in IndrasNet logs/loop_freeze_tracebacks.log; the top IndrasNet frame on the loop thread is the blocking call."
      - eval_time: 150m
        alertname: M5BusyWhileVoiceWaits
        exp_alerts:
          - exp_labels:
              domain: "voice"
              severity: "warning"
            exp_annotations:
              summary: "Voice notes are waiting while the M5 runs CI jobs (M5 load 11.4)"
              description: "The M5 does voice-to-text and also hosts both CI runners. On 2026-11-21 it turned a 10-minute note into text in 14 minutes, about 1x realtime instead of the usual 28x or more, and nothing recorded why. This says when the two coincide: 2 note(s) waiting, with indras_m5_ci_jobs_running and indras_m5_load1 as the evidence."
