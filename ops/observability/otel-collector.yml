extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/tempo_queue:
    directory: '${env:LCT_OBSERVABILITY_RUNTIME_ROOT}\data\collector-storage'
    timeout: 1s
    max_size: 268435456
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
  hostmetrics/system:
    collection_interval: 10s
    initial_delay: 1s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
      paging:
      disk:
      network:
      system:
  hostmetrics/processes:
    collection_interval: 15s
    initial_delay: 2s
    scrapers:
      process:
        mute_process_all_errors: true
        metrics:
          process.cpu.time:
            enabled: false
          process.cpu.utilization:
            enabled: true
          process.disk.io:
            enabled: true
          process.memory.usage:
            enabled: true
          process.memory.virtual:
            enabled: false
          process.handles:
            enabled: true
          process.threads:
            enabled: true
          process.uptime:
            enabled: true

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64
  transform/process_classification:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - 'set(attributes["process.workload"], "lct-backend") where IsMatch(attributes["process.command_line"], "(?i)lct_python_backend\\.backend:lct_app")'
          - 'set(attributes["process.workload"], "indrasnet-web") where IsMatch(attributes["process.command_line"], "(?i)grimoire\\.IndrasNet\\.agents\\.web_server")'
          - 'set(attributes["process.workload"], "indrasnet-supervisor") where IsMatch(attributes["process.command_line"], "(?i)start_all\\.py")'
          - 'set(attributes["process.workload"], "indrasnet-prayer") where IsMatch(attributes["process.command_line"], "(?i)grimoire\\.IndrasNet\\.agents\\.prayer_agent")'
          - 'set(attributes["process.workload"], "indrasnet-beeper") where IsMatch(attributes["process.command_line"], "(?i)grimoire\\.IndrasNet\\.agents\\.beeper_execution_agent")'
          - 'set(attributes["process.workload"], "feed-crawler-browser") where IsMatch(attributes["process.executable.path"], "(?i)feed_crawler.*playwright.*node")'
          - 'set(attributes["process.workload"], "feed-crawler") where IsMatch(attributes["process.command_line"], "(?i)(feed_crawler|-m\\s+crawler)") or IsMatch(attributes["process.executable.path"], "(?i)feed_crawler.*python")'
          - 'set(attributes["process.workload"], "comfyui") where IsMatch(attributes["process.command_line"], "(?i)ComfyUI") or IsMatch(attributes["process.executable.path"], "(?i)envs.*comfy.*python")'
          - 'set(attributes["process.workload"], "codex") where IsMatch(attributes["process.command_line"], "(?i)OpenAI.*Codex") or IsMatch(attributes["process.executable.path"], "(?i)OpenAI.*Codex")'
  resource/privacy:
    attributes:
      - key: process.command
        action: delete
      - key: process.command_line
        action: delete
      - key: process.command_args
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.owner
        action: delete
  attributes/privacy:
    actions:
      - key: url.query
        action: delete
      - key: http.target
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      - key: db.statement.parameters
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: transcript
        action: delete
      - key: prompt
        action: delete
      - key: response
        action: delete
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: 127.0.0.1:4319
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 2048
      storage: file_storage/tempo_queue
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 10m
  prometheus:
    endpoint: 127.0.0.1:9464
    metric_expiration: 5m
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check, file_storage/tempo_queue]
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: '127.0.0.1'
                port: 18888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/privacy, attributes/privacy, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, hostmetrics/system, hostmetrics/processes]
      processors: [memory_limiter, transform/process_classification, resource/privacy, attributes/privacy, batch]
      exporters: [prometheus]
