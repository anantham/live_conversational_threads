global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 14d
      size: 4GB

rule_files:
  - "prometheus-alerts.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:18888"]
  - job_name: otel-metrics
    # The first all-process render measured 5.38s. Keep this below the 15s
    # interval, but separate it from the unchanged 3s service health probes.
    scrape_timeout: 10s
    static_configs:
      - targets: ["127.0.0.1:9464"]
  - job_name: indrasnet
    metrics_path: /metrics/
    static_configs:
      - targets: ["127.0.0.1:7777"]
  - job_name: tempo
    static_configs:
      - targets: ["127.0.0.1:3200"]
  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3000"]
