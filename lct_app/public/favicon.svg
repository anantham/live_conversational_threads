<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Live Conversational Threads — three swim-lane threads with a tangent.
       Top row: temporal chain in teal (chunks tier).
       Middle: branching idea (blue) joining via a connector.
       Bottom: separate thread (purple) with its own short chain. -->
  <rect width="32" height="32" rx="6" fill="#f8fafc"/>

  <!-- Top row: chunks -->
  <circle cx="6" cy="9" r="2.2" fill="#5eead4"/>
  <circle cx="13" cy="9" r="2.2" fill="#5eead4"/>
  <circle cx="20" cy="9" r="2.2" fill="#5eead4"/>
  <circle cx="27" cy="9" r="2.2" fill="#5eead4"/>
  <line x1="8" y1="9" x2="11" y2="9" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="15" y1="9" x2="18" y2="9" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="22" y1="9" x2="25" y2="9" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- Middle row: idea (blue) tangent off chunk-2 -->
  <line x1="13" y1="11" x2="13" y2="15" stroke="#94a3b8" stroke-width="0.8"/>
  <circle cx="13" cy="17" r="2.4" fill="#93c5fd"/>

  <!-- Bottom row: theme / separate thread (purple) -->
  <circle cx="6" cy="25" r="2.2" fill="#d8b4fe"/>
  <circle cx="13" cy="25" r="2.2" fill="#d8b4fe"/>
  <line x1="8" y1="25" x2="11" y2="25" stroke="#94a3b8" stroke-width="0.8"/>
</svg>
