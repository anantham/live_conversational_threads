name: pytest (DB integration)

# PR gate: boot Postgres, run alembic migrations, then run the real-DB
# integration tests (the tests/integration/*_pg.py suite + the import-turns
# endpoint test). These exercise the canonical write paths — persist_graph's
# destructive delete-before-insert and resume path, persist_turns, coverage
# linking, subject-review — against a live Postgres, which mocks cannot
# reproduce (FK cascades, CHECK constraints, delete ordering).
#
# They are skip-gated on DATABASE_URL in code, so they no-op on a machine
# without a DB; here the Postgres service is present, so they actually run.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pytest-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-integration:
    name: pytest integration (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lct_user
          POSTGRES_PASSWORD: lct_password
          POSTGRES_DB: lct_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lct_user -d lct_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lct_user:lct_password@localhost:5433/lct_dev
      AUTH_TOKEN: ""
      DEBUG: "false"
      ENVIRONMENT: "test"
      LOG_LEVEL: "INFO"
      STT_AUTOSTART: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lct_python_backend/requirements.txt

      - name: Install backend deps
        working-directory: lct_python_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations
        working-directory: lct_python_backend
        run: alembic upgrade head

      - name: Run DB integration tests
        working-directory: lct_python_backend
        run: |
          # Glob picks up every *_pg.py (so new ones in follow-on PRs are
          # auto-included) plus the import-turns endpoint test, which is DB-backed
          # but not _pg-suffixed.
          python -m pytest \
            tests/integration/*_pg.py \
            tests/integration/test_import_turns_endpoint.py \
            -v --tb=short
