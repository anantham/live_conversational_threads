name: e2e (smoke)

# PR gate: boot Postgres + the FastAPI backend + the Vite frontend, then run
# the DB-independent Playwright smoke specs. The data-dependent specs
# (hierarchy-tabs-visual, quota-recording, graph-visualization, import-audio,
# mobile-audit) join one-by-one as each is refactored to self-provision its
# conversation via the API at test setup. The live-recording-stream spec
# stays opt-in via RUN_STT_E2E — see nightly-stt-e2e.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: Playwright smoke (DB-independent specs)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lct_user
          POSTGRES_PASSWORD: lct_password
          POSTGRES_DB: lct_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lct_user -d lct_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Backend — talks to the Postgres service above on the mapped host port.
      DATABASE_URL: postgresql://lct_user:lct_password@localhost:5433/lct_dev
      AUTH_TOKEN: ""
      DEBUG: "false"
      ENVIRONMENT: "test"
      LOG_LEVEL: "INFO"
      # Skip the local-STT autostart machinery in CI — the smoke specs don't
      # exercise STT and we don't want a hanging health probe.
      STT_AUTOSTART: "0"

      # Frontend — Vite's dev port, and the proxy target it routes /api etc. to.
      FRONTEND_PORT: "43173"
      VITE_BACKEND_PORT: "43181"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lct_python_backend/requirements.txt

      - name: Install backend deps
        working-directory: lct_python_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations
        working-directory: lct_python_backend
        run: alembic upgrade head

      - name: Start backend (uvicorn :43181)
        run: |
          nohup uvicorn lct_python_backend.backend:lct_app \
            --host 0.0.0.0 --port 43181 \
            > backend.log 2>&1 &
          echo $! > backend.pid

          # Wait up to 60s for FastAPI to respond. /openapi.json is a known-good
          # 200 once the app has finished startup.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:43181/openapi.json > /dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start within 60s"
          cat backend.log
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lct_app/package-lock.json

      - name: Install frontend deps
        working-directory: lct_app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: lct_app
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke specs
        working-directory: lct_app
        env:
          # playwright.config.ts already keys retries / workers on this.
          CI: "true"
        run: |
          npx playwright test \
            initialization \
            d4-color-mode-smoke \
            d6-autosave-smoke \
            fullscreen-button

      - name: Backend log on failure
        if: failure()
        run: |
          echo "=== backend.log ==="
          cat backend.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: lct_app/playwright-report/
          retention-days: 14
